[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab0-experiment-harness"
version = "0.1.0"
description = "Lab 0: reproducible experiment infrastructure (course 'Neural Networks')"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0,<3.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pytest>=7.0",
    "pillow>=9.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
